<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mad Mice — Cozy</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="game"></canvas>

<audio id="catchSound" preload="auto" src="./click.wav"></audio><audio id="goldSound" preload="auto" src="./gold.wav"></audio>
<div id="hud" class="hidden">
  <div><b id="score">0</b><small>score</small></div>
  <div><b id="combo">x1</b><small>combo</small></div>
  <div><b id="best">0</b><small>best</small></div>
  <button id="sound" type="button" aria-label="Sound on">🔊</button><button id="pause" type="button">Ⅱ</button>
</div>

<div id="menu" class="screen">
  <div class="card">
    <div class="logo">🐭</div>
    <h1>Mad Mice</h1>
    <p>A tiny, cozy game about catching wandering mice.<br>There is no rush. Just relax and play.</p>
    <button id="play" type="button">Relax &amp; Play</button>
    <button id="endless" class="soft" type="button">Endless &amp; Chill</button>
    <button id="shop" class="shopButton" type="button">🧢 Mouse Shop</button>
    <small>Click or tap a mouse</small>
  </div>
</div>


<div id="shopScreen" class="screen hidden">
  <div class="card shopCard">
    <div class="shopTop">
      <div>
        <div class="logo">🧢</div>
        <h2>Mouse Shop</h2>
        <p class="shopSub">Catch mice to unlock tiny hats.</p>
      </div>
      <div class="mouseCount"><b id="lifetimeCaught">0</b><small>mice caught</small></div>
    </div>
    <div id="hatGrid" class="hatGrid"></div>
    <button id="closeShop" class="soft" type="button">Back</button>
  </div>
</div>

<div id="pauseScreen" class="screen hidden">
  <div class="card">
    <h2>Paused</h2>
    <button id="resume" type="button">Continue</button>
    <button id="quit" class="soft" type="button">Main Menu</button>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="card">
    <div class="logo">🌙</div>
    <h2>Cozy session complete</h2>
    <div class="results">
      <div><b id="finalScore">0</b><small>score</small></div>
      <div><b id="finalCaught">0</b><small>caught</small></div>
    </div>
    <button id="again" type="button">Play Again</button>
    <button id="home" class="soft" type="button">Main Menu</button>
  </div>
</div>

<div id="error" class="error hidden"></div>
<script src="./script.js"></script>
</body>
</html>
